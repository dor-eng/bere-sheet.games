<svg xmlns="http://www.w3.org/2000/svg" width="54" height="28" viewBox="0 0 54 28" role="img" aria-label="fx-dust"><title>fx-dust</title><style>.line{stroke:#1E2A3A;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.shadow{fill:#1E2A3A;opacity:.16;stroke:none}.bulb{animation:twinkle 1.9s steps(2,end) infinite}.bulb:nth-of-type(2n){animation-delay:-.7s}.bulb:nth-of-type(3n){animation-delay:-1.3s}.hook{transform-origin:99px 39px;animation:sway 3.2s ease-in-out infinite alternate}@keyframes twinkle{50%{opacity:.45}}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="line" stroke-width="2"><path d="M8 25Q-2 22 5 15q-3-13 10-9 7-10 15 1 16-6 16 8 13 7 0 11z" fill="#f5edc8" fill-opacity=".85" stroke="#bc8855"/><path d="M10 18q0-6 6-6m12 6q2-7 8-5" fill="none" stroke="#fff9e8"/></g></svg>
