<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="icon-coin"><title>icon-coin</title><style>.line{stroke:#1E2A3A;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.shadow{fill:#1E2A3A;opacity:.16;stroke:none}.bulb{animation:twinkle 1.9s steps(2,end) infinite}.bulb:nth-of-type(2n){animation-delay:-.7s}.bulb:nth-of-type(3n){animation-delay:-1.3s}.hook{transform-origin:99px 39px;animation:sway 3.2s ease-in-out infinite alternate}@keyframes twinkle{50%{opacity:.45}}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="line"><ellipse cx="33" cy="34" rx="25" ry="27" fill="#d89f25"/><circle cx="30" cy="29" r="25" fill="#FFCC00"/><circle cx="30" cy="29" r="18" fill="none" stroke="#e9a52d" stroke-width="3"/><path d="m24 19 12 20m0-20L24 39" stroke="#a57b16" stroke-width="4"/><path d="M14 20q3-7 9-8" fill="none" stroke="#fff18a" stroke-width="4"/></g></svg>
