<svg xmlns="http://www.w3.org/2000/svg" width="70" height="48" viewBox="0 0 70 48" role="img" aria-label="wedding-table"><title>wedding-table</title><style>.line{stroke:#1E2A3A;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.shadow{fill:#1E2A3A;opacity:.16;stroke:none}.bulb{animation:twinkle 1.9s steps(2,end) infinite}.bulb:nth-of-type(2n){animation-delay:-.7s}.bulb:nth-of-type(3n){animation-delay:-1.3s}.hook{transform-origin:99px 39px;animation:sway 3.2s ease-in-out infinite alternate}@keyframes twinkle{50%{opacity:.45}}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="line"><ellipse cx="38" cy="41" rx="29" ry="5" class="shadow"/><path d="M16 24v17m37-17v17" fill="none" stroke="#916e47" stroke-width="4"/><path d="M4 16q30-17 62 0v14q-7 8-14 1-9 8-18 1-9 8-17 0-8 4-13-2z" fill="#e1e7df"/><ellipse cx="35" cy="16" rx="31" ry="12" fill="#fff9e8"/><ellipse cx="19" cy="17" rx="7" ry="3" fill="#dbe7e7" stroke-width="1.5"/><ellipse cx="51" cy="15" rx="7" ry="3" fill="#dbe7e7" stroke-width="1.5"/><path d="m31 10 3 10h6l3-10z" fill="#a5e5ef" stroke-width="2"/><path d="M37 12V5" stroke="#669f39"/><circle cx="37" cy="5" r="3.5" fill="#f07d89" stroke-width="1.5"/></g></svg>
