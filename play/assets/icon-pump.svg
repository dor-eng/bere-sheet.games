<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="icon-pump"><title>icon-pump</title><style>.line{stroke:#1E2A3A;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.shadow{fill:#1E2A3A;opacity:.16;stroke:none}.bulb{animation:twinkle 1.9s steps(2,end) infinite}.bulb:nth-of-type(2n){animation-delay:-.7s}.bulb:nth-of-type(3n){animation-delay:-1.3s}.hook{transform-origin:99px 39px;animation:sway 3.2s ease-in-out infinite alternate}@keyframes twinkle{50%{opacity:.45}}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="line"><path d="m8 47 35 11 16-10-35-9z" class="shadow"/><path d="M10 23h29v27H10z" fill="#0A4E7F"/><path d="m10 23 10-8h29l-10 8z" fill="#397d9d"/><path d="m39 23 10-8v26l-10 9z" fill="#083b63"/><circle cx="24" cy="33" r="9" fill="#ecf4f3"/><path d="m24 33 4-5" fill="none" stroke-width="2"/><path d="M15 21V10h16v9" fill="none" stroke-width="5"/><path d="M44 31q16-6 15 13T43 55q-12-1-17-10" fill="none" stroke="#243848" stroke-width="5"/><path d="m27 45-5-6" stroke="#91adb9" stroke-width="7"/></g></svg>
