<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="icon-star"><title>icon-star</title><style>.line{stroke:#1E2A3A;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.shadow{fill:#1E2A3A;opacity:.16;stroke:none}.bulb{animation:twinkle 1.9s steps(2,end) infinite}.bulb:nth-of-type(2n){animation-delay:-.7s}.bulb:nth-of-type(3n){animation-delay:-1.3s}.hook{transform-origin:99px 39px;animation:sway 3.2s ease-in-out infinite alternate}@keyframes twinkle{50%{opacity:.45}}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="line"><path d="m32 5 9 17 19 3-14 14 3 20-17-9-17 9 3-20L4 25l19-3z" fill="#e9a52d"/><path d="m32 3 9 17 19 3-14 14 3 19-17-9-17 9 3-19L4 23l19-3z" fill="#FFCC00"/><path d="m29 12-6 13-9 1" fill="none" stroke="#fff18a" stroke-width="4"/></g></svg>
