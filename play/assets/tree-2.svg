<svg xmlns="http://www.w3.org/2000/svg" width="54" height="84" viewBox="0 0 54 84" role="img" aria-label="tree-2"><title>tree-2</title><style>.line{stroke:#1E2A3A;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.shadow{fill:#1E2A3A;opacity:.16;stroke:none}.bulb{animation:twinkle 1.9s steps(2,end) infinite}.bulb:nth-of-type(2n){animation-delay:-.7s}.bulb:nth-of-type(3n){animation-delay:-1.3s}.hook{transform-origin:99px 39px;animation:sway 3.2s ease-in-out infinite alternate}@keyframes twinkle{50%{opacity:.45}}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="line"><ellipse cx="30" cy="77" rx="22" ry="6" class="shadow"/><path d="M24 53v24h7V49" fill="#a77644"/><path d="M6 61 18 42H9l13-20h-6L28 3l13 22h-6l12 20h-8l12 18q-22 12-45-2z" fill="#669f39"/><path d="m18 53 8-12m-3-10 5-8" fill="none" stroke="#a7d761" stroke-width="4"/></g></svg>
