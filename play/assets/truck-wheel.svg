<svg xmlns="http://www.w3.org/2000/svg" width="16" height="20" viewBox="0 0 16 20" role="img" aria-label="truck-wheel"><title>truck-wheel</title><style>.line{stroke:#1E2A3A;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.shadow{fill:#1E2A3A;opacity:.16;stroke:none}.bulb{animation:twinkle 1.9s steps(2,end) infinite}.bulb:nth-of-type(2n){animation-delay:-.7s}.bulb:nth-of-type(3n){animation-delay:-1.3s}.hook{transform-origin:99px 39px;animation:sway 3.2s ease-in-out infinite alternate}@keyframes twinkle{50%{opacity:.45}}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="line"><ellipse cx="8" cy="10" rx="6.5" ry="8.5" fill="#263447"/><ellipse cx="8" cy="10" rx="2.5" ry="4.5" fill="#c2d5df" stroke-width="2"/></g></svg>
