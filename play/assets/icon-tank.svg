<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="icon-tank"><title>icon-tank</title><style>.line{stroke:#1E2A3A;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.shadow{fill:#1E2A3A;opacity:.16;stroke:none}.bulb{animation:twinkle 1.9s steps(2,end) infinite}.bulb:nth-of-type(2n){animation-delay:-.7s}.bulb:nth-of-type(3n){animation-delay:-1.3s}.hook{transform-origin:99px 39px;animation:sway 3.2s ease-in-out infinite alternate}@keyframes twinkle{50%{opacity:.45}}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="line"><ellipse cx="34" cy="55" rx="25" ry="6" class="shadow"/><path d="M7 22q0-15 17-15h18q15 0 15 15v21q0 12-16 12H23Q7 55 7 43z" fill="#dbe7e7"/><path d="M20 9v44m22-44v44" stroke="#91adb9" stroke-width="5"/><path d="M15 17q4-5 17-5" fill="none" stroke="#fff" stroke-width="4"/><path d="M26 6V3h12v4M49 47h10v9h-6v-5" fill="#0A4E7F"/><path d="m32 24-6 10a7 7 0 1 0 12 0z" fill="#48b5d3" stroke-width="2"/></g></svg>
