<svg xmlns="http://www.w3.org/2000/svg" width="220" height="170" viewBox="0 0 220 170" role="img" aria-label="site-construction"><title>site-construction</title><style>.line{stroke:#1E2A3A;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.shadow{fill:#1E2A3A;opacity:.16;stroke:none}.bulb{animation:twinkle 1.9s steps(2,end) infinite}.bulb:nth-of-type(2n){animation-delay:-.7s}.bulb:nth-of-type(3n){animation-delay:-1.3s}.hook{transform-origin:99px 39px;animation:sway 3.2s ease-in-out infinite alternate}@keyframes twinkle{50%{opacity:.45}}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><pattern id="grain" width="37" height="31" patternUnits="userSpaceOnUse"><path d="M5 8h3m20 13h2M16 29h4" stroke="#b6814c" stroke-width="2" stroke-linecap="round" opacity=".28"/></pattern><pattern id="caution" width="18" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-22)"><rect width="18" height="10" fill="#FFCC00"/><path d="M0 0h8v10H0z" fill="#1E2A3A"/></pattern></defs><g class="line"><path d="m3 40 148-30 66 33-4 89-139 35-71-34z" fill="#bc8855"/><path d="m3 32 148-28 66 31-4 89-139 35-71-34z" fill="#F2C38B"/><path d="m3 32 148-28 66 31-4 89-139 35-71-34z" fill="url(#grain)" stroke="none"/><path d="m24 72 19-25 25 34-25 9z" fill="#dda15d"/><path d="m25 73 18-25 7 25" fill="#ffda98" stroke="none"/><path d="m20 106 36-10 15 11-36 12z" fill="#cf8c65"/><path d="M35 119v18l36-12v-18m-36 30-15-13v-18" fill="#ac6d50"/><path d="m36 126 34-10m-20-2v16" fill="none" stroke-width="2"/><path d="M8 31v29m50-39v29m50-39v29m49-36v29m53 2v30M8 108v30m66 0v28m63-45v29m73-47v30" fill="none" stroke="#916e47" stroke-width="5"/><path d="m9 34 148-28 52 28v8l-52-28L9 42zM9 111l65 31 136-34v9L74 151 9 120z" fill="url(#caution)" stroke-width="2"/></g></svg>
